name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - name: Build
        run: swift build
      # Runs the unit tests on the macOS host: rules, shared case tables and
      # off-screen SwiftUI drawing. The README snippet is compiled by this target.
      - name: Test
        run: swift test
